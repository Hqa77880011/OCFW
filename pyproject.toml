[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ocfw"
version = "0.1.0"
readme = "README.md"
description = "OCFW implementation"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "pandas>=2.0", "scikit-learn>=1.3", "matplotlib>=3.7", "torch>=2.2"]

[tool.setuptools.packages.find]
include = ["ocfr*"]
